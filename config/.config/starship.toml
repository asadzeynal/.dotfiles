format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
$time\
\n$character"""

[directory]
style = "fg:#4c4769"
format = "[$path]($style)"
truncation_length = 5
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:#797582"
format = '[  $symbol $branch]($style)'

[git_status]
disabled = true
style = "fg:#797582"
format = '[ $all_status$ahead_behind]($style)'

[nodejs]
symbol = ""
style = "fg:#797582"
format = '[  $symbol ($version)]($style)'

[rust]
symbol = ""
style = "fg:#797582"
format = '[  $symbol ($version)]($style)'

[golang]
disabled = true
symbol = ""
style = "fg:#797582"
format = '[  $symbol ($version)]($style)'

[php]
symbol = ""
style = "fg:#797582"
format = '[  $symbol ($version)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#797582"
format = '[  $time]($style)'

[character]
success_symbol = "[❯](bold #618774)"
error_symbol = "[❯](bold #b4637a)"
